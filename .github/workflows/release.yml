name: release

on:
  push:
    branches: [main]
    # Release only when the shipped binary or installer can change. Docs-only
    # merges (README, docs/, scripts/, tests) do not cut a version; use
    # "Run workflow" to republish by hand.
    paths:
      - '**.go'
      - '!**_test.go'
      - 'go.mod'
      - 'go.sum'
      - '**.syso'
      - 'installer/**'
      - 'assets/yozora.ico'
      - 'internal/server/ui.html'
      - 'internal/server/fonts/**'
      - 'internal/tray/*.ico'
      - '.github/workflows/release.yml'
      - 'scripts/check-installed-upgrade.ps1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # $series is the major.minor line; raise it by hand for a big change. The next
          # release is the highest v<series>.N tag + 1, or v<series>.0 for a new series.
          # (Counting tags, not the run number, which collided with the hand-made v0.1.1.)
          $series = '0.2'
          $drafts = gh release list --repo '${{ github.repository }}' --limit 1000 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect releases' }
          if (@($drafts | Where-Object { $_.isDraft -and $_.tagName -match '^v0\.2\.\d+$' }).Count -gt 0) { throw 'An unfinished 0.2 release draft requires review before another release' }
          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch tags' }
          $pattern = '^v' + [regex]::Escape($series) + '\.(\d+)$'
          $n = git tag --list "v$series.*" | ForEach-Object { if ($_ -match $pattern) { [int]$Matches[1] } } | Sort-Object | Select-Object -Last 1
          if ($null -eq $n -or $n -lt 1 -or -not (git tag --list 'v0.2.1')) { throw 'Published v0.2.1 baseline tag is missing' }
          $v = "$series.$($n + 1)"
          Write-Host "Next version: v$v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -ldflags "-s -w -H=windowsgui -X uika-resonance/internal/version.Version=${{ steps.version.outputs.version }}" -o Yozora.exe ./cmd/yozora
      - name: Check GUI subsystem
        run: |
          # A console-subsystem exe opens a terminal window on double-click (the v0.1.1 daemon did). Require GUI (2).
          $b = [IO.File]::ReadAllBytes("Yozora.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          if ($sub -ne 2) { throw "Yozora.exe PE subsystem is $sub, expected 2 (Windows GUI)" }
          Write-Host "Yozora.exe PE subsystem: $sub (Windows GUI)"

      # Code signing (SignPath Foundation). Inert until the owner adds the
      # SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable;
      # without them every signing step is skipped and the release ships
      # unsigned exactly as before. See README "Code signing".
      - name: Signing available
        id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $on = (-not [string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN)) -and (-not [string]::IsNullOrEmpty($env:SIGNPATH_ORGANIZATION_ID))
          Write-Host "Code signing: $(if ($on) { 'enabled' } else { 'skipped (secrets not configured)' })"
          "enabled=$($on.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload unsigned Yozora.exe for signing
        id: unsigned-exe
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: Yozora.exe
          if-no-files-found: error
      - name: Sign Yozora.exe
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'yozora' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIG_SLUG || 'exe' }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe
      - name: Use signed Yozora.exe
        if: steps.signing.outputs.enabled == 'true'
        run: |
          Copy-Item signed-exe\Yozora.exe Yozora.exe -Force
          $s = Get-AuthenticodeSignature Yozora.exe
          if ($s.Status -ne 'Valid') { throw "Yozora.exe signature status: $($s.Status)" }
          Write-Host "Yozora.exe signed by $($s.SignerCertificate.Subject)"

      - name: Installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\yozora.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Upload unsigned installer for signing
        id: unsigned-setup
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/Yozora-Setup.exe
          if-no-files-found: error
      - name: Sign installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'yozora' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIG_SLUG || 'setup' }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup
      - name: Use signed installer
        if: steps.signing.outputs.enabled == 'true'
        run: |
          Copy-Item signed-setup\Yozora-Setup.exe dist\Yozora-Setup.exe -Force
          $s = Get-AuthenticodeSignature dist\Yozora-Setup.exe
          if ($s.Status -ne 'Valid') { throw "Yozora-Setup.exe signature status: $($s.Status)" }

      - name: Checksums
        run: |
          Copy-Item Yozora.exe dist\Yozora.exe
          Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist\SHA256SUMS.txt
      - name: Smoke test installed upgrade and signing continuity
        timeout-minutes: 10
        run: ./scripts/check-installed-upgrade.ps1 -CandidateSetup dist/Yozora-Setup.exe -CandidateExe dist/Yozora.exe -Version '${{ steps.version.outputs.version }}' -RequireSigningContinuity
      - name: Winget manifests
        run: |
          # Fills packaging/winget templates for this release. Uploaded as a build
          # artifact only; submitting to microsoft/winget-pkgs stays a manual step.
          $v = "${{ steps.version.outputs.version }}"
          $sha = (Get-FileHash dist\Yozora-Setup.exe -Algorithm SHA256).Hash.ToUpper()
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/Yozora-Setup.exe"
          $out = "winget\$v"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem packaging\winget\*.yaml | ForEach-Object {
            $text = (Get-Content $_.FullName -Raw).Replace('{{VERSION}}', $v).Replace('{{SHA256}}', $sha).Replace('{{INSTALLER_URL}}', $url).Replace('{{REPOSITORY}}', '${{ github.repository }}')
            if ($text -match '\{\{[A-Z_0-9]+\}\}') { throw "unfilled placeholder in $($_.Name): $($Matches[0])" }
            [IO.File]::WriteAllText((Join-Path $out $_.Name), $text, [Text.UTF8Encoding]::new($false))
          }
          Get-ChildItem $out | ForEach-Object { Write-Host $_.Name }
      - name: Upload winget manifests
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ steps.version.outputs.version }}
          path: winget/
          if-no-files-found: error
      - name: Stage and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release create $tag dist/Yozora-Setup.exe dist/Yozora.exe dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "Yozora ${{ steps.version.outputs.version }}" --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          New-Item -ItemType Directory -Force uploaded | Out-Null
          gh release download $tag --dir uploaded
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset download failed' }
          $names = @('Yozora-Setup.exe', 'Yozora.exe', 'SHA256SUMS.txt')
          $actual = @(Get-ChildItem uploaded -File | Select-Object -ExpandProperty Name)
          if ($actual.Count -ne $names.Count) { throw 'Unexpected draft asset count' }
          foreach ($name in $names) {
            if ($name -notin $actual -or (Get-FileHash "dist/$name").Hash -ne (Get-FileHash "uploaded/$name").Hash) { throw "Draft asset mismatch: $name" }
          }
      - name: Publish verified draft as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v${{ steps.version.outputs.version }}" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing verified draft failed' }

  live-update:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download published assets
        run: |
          New-Item -ItemType Directory -Force published | Out-Null
          foreach ($name in @('Yozora-Setup.exe', 'Yozora.exe', 'SHA256SUMS.txt')) {
            Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/v${{ needs.windows.outputs.version }}/$name" -OutFile "published/$name" -TimeoutSec 120
          }
      - name: Smoke test published one-click update from v0.2.1
        timeout-minutes: 12
        run: ./scripts/check-installed-upgrade.ps1 -CandidateSetup published/Yozora-Setup.exe -CandidateExe published/Yozora.exe -Version '${{ needs.windows.outputs.version }}' -RequireSigningContinuity -LiveUpdate
